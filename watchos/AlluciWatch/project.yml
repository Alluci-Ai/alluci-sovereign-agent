name: AlluciWatch
options:
  bundleIdPrefix: ai.alluci
  deploymentTarget:
    watchOS: 10.0

targets:
  "AlluciWatch Watch App":
    type: application
    platform: watchOS
    deploymentTarget: 10.0
    sources:
      - path: AlluciWatchApp.swift
      - path: Managers
      - path: Models
      - path: Views
      - path: "AlluciWatch Watch App/Assets.xcassets"
    info:
      path: "AlluciWatch Watch App/Info.plist"
      properties:
        WKApplication: true
        WKWatchOnly: true
        NSHealthShareUsageDescription: "Alluci reads Heart Rate and HRV to adapt your AI agent to your physiological state in real time."
        NSHealthUpdateUsageDescription: "Alluci does not write health data."
        UIBackgroundModes: ["remote-notification"]
    entitlements:
      path: "AlluciWatch Watch App/AlluciWatch Watch App.entitlements"
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    settings:
      SWIFT_VERSION: 5.9
      PRODUCT_BUNDLE_IDENTIFIER: ai.alluci.AlluciWatch
