version: '3.8'

services:
  backend:
    profiles: ["full", "pi", "lite"]
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://polytope:${DB_PASSWORD:-sovereign}@db:5432/polytope_db
    # Profile-specific LITE_MODE defaults can be handled via separate .env files 
    # but here we ensure the containers are tagged.

  redis:
    profiles: ["full", "pi", "lite"]
    image: redis:alpine

  db:
    profiles: ["full", "pi"] # In 'lite' we might use SQLite, but keep Postgres for consistency
    image: postgres:15-alpine

  frontend:
    profiles: ["full", "pi", "lite"]
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_DAEMON_URL=http://backend:8000
    restart: unless-stopped

volumes:
  polytope_data:
  db_data:
