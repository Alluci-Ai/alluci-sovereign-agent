version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://polytope:${DB_PASSWORD:-sovereign}@db:5432/polytope_db
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - polytope_data:/home/polytope/.polytope
      - ./TASKS.md:/app/TASKS.md
      - ./HEARTBEAT.md:/app/HEARTBEAT.md
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=polytope
      - POSTGRES_PASSWORD=${DB_PASSWORD:-sovereign}
      - POSTGRES_DB=polytope_db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U polytope -d polytope_db" ]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  frontend:

    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_DAEMON_URL=http://backend:8000
    restart: unless-stopped

volumes:
  polytope_data:
  db_data:
