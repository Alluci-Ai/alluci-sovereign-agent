# docker-compose.yml
version: "3.9"

services:

  db:
    image: postgres:16-alpine@sha256:PIN_THIS_DIGEST
    environment:
      POSTGRES_USER: alluci
      # NO :-default fallback. If DB_PASSWORD is unset, compose will error at startup.
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set in environment}"
      POSTGRES_DB: alluci
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sovereign_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alluci -d alluci"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"

  redis:
    image: redis:7-alpine@sha256:PIN_THIS_DIGEST
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    networks:
      - sovereign_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://alluci:${DB_PASSWORD}@db:5432/alluci"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sovereign_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    read_only: true
    tmpfs:
      - /tmp
      - /app/logs
      - /home/polytope/.polytope/vaults
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "1G"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sovereign_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"

volumes:
  postgres_data:
  redis_data:

networks:
  sovereign_net:
    driver: overlay
    attachable: true
