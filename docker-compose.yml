version: "3.9"
services:
  agent:
    build: .
    image: sovereign-agent:dev
    container_name: sovereign-agent-dev
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
    volumes:
      - .:/app:cached
    # Run as the same UID/GID as the host user to avoid permission issues
    user: "${UID}:${GID}"
