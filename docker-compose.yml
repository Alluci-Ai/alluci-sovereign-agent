# docker-compose.yml — PRODUCTION READINESS REVISION

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: alluci_daemon
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://alluci:${DB_PASSWORD:-alluci_prod_pwd}@db:5432/alluci_db
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=production
    ports:
      - "8000:8000"
    volumes:
      - ./backend/security:/app/backend/security:ro
    depends_on:
      - db
      - redis
    networks:
      - sovereign_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: alluci_manifold
    restart: unless-stopped
    ports:
      - "3000:80"
    secrets:
      - alluci_tls_cert
      - alluci_tls_key
    depends_on:
      - backend
    networks:
      - sovereign_net

  db:
    image: postgres:16-alpine
    container_name: alluci_db
    environment:
      - POSTGRES_DB=alluci_db
      - POSTGRES_USER=alluci
      - POSTGRES_PASSWORD=${DB_PASSWORD:-alluci_prod_pwd}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sovereign_net

  redis:
    image: redis:7-alpine
    container_name: alluci_redis
    networks:
      - sovereign_net

networks:
  sovereign_net:
    driver: bridge

volumes:
  postgres_data:

secrets:
  alluci_tls_cert:
    file: ${TLS_CERT_PATH:-./certs/fullchain.pem}
  alluci_tls_key:
    file: ${TLS_KEY_PATH:-./certs/privkey.pem}
