[project]
name = "alluci-sovereign-agent"
version = "6.4.0"
description = "Alluci Sovereign Agent Backend"
authors = [
    {name = "Alluci Fulcanelli", email = "alluci@alluci.ai"}
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "sqlmodel>=0.0.8",
    "zstandard>=0.22.0",
]
requires-python = ">=3.11"

[tool.commitizen]
name = "cz_conventional_commits"
version = "6.4.0"
tag_format = "v$version"
version_files = [
    "pyproject.toml:version",
    "package.json:version"
]
