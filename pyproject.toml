[project]
name = "alluci-sovereign-agent"
version = "6.5.0-stable-grounding-dossier"
description = "Alluci Sovereign Agent Backend"
authors = [
    {name = "Alluci Fulcanelli", email = "alluci@alluci.ai"}
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "sqlmodel>=0.0.8",
    "zstandard>=0.22.0",
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "locust>=2.30.0"
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "6.4.0"
tag_format = "v$version"
version_files = [
    "pyproject.toml:version",
    "package.json:version"
]

[tool.ruff]
target-version = "py311"
exclude = [
    "backend/tests/tests_to_add_fixed.py",  # Incomplete scratch file with syntax errors
    "backend/tests/tests_to_add.py",         # Incomplete scratch file with syntax errors
]

[tool.ruff.lint]
# Ignore pre-existing style issues that cannot be auto-fixed
ignore = [
    "E701",   # Multiple statements on one line (colon)
    "E702",   # Multiple statements on one line (semicolon)
    "E402",   # Module import not at top of file — intentional late imports
    "E711",   # Comparison to None (use `is` / `is not`)
    "E712",   # Comparison to True/False
    "E722",   # Bare except
    "F401",   # Unused imports — many are conditional/re-exports in bridge files
    "F841",   # Unused variables — pre-existing, low-risk
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Bridge files have undefined names from missing optional SDKs
"backend/bridges/*.py" = ["F821"]
"backend/engine/dream_cycle.py" = ["F823"]
