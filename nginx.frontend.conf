server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Optional: proxy /api to backend for local compose debug without the edge nginx
    # location /api {
    #     proxy_pass http://backend:8000;
    # }
}
