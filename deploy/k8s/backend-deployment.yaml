apiVersion: apps/v1
kind: Deployment
metadata:
  name: alluci-backend
  labels:
    app: alluci-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alluci-backend
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: alluci-backend
    spec:
      containers:
      - name: backend
        image: alluci-backend:0.9.5-rc1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: APP_ENV
          value: "production"
        - name: POLYTOPE_STORAGE_ROOT
          value: "/data"
        envFrom:
        - secretRef:
            name: alluci-secrets
        volumeMounts:
        - name: vault-storage
          mountPath: /data/vaults
        - name: memory-storage
          mountPath: /data/memory
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m" # Boosted for Dream Cycle (DPO training)
            memory: "2Gi" # Boosted for Dream Cycle
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /api/v1/ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
      volumes:
      - name: vault-storage
        persistentVolumeClaim:
          claimName: alluci-vault-pvc
      - name: memory-storage
        persistentVolumeClaim:
          claimName: alluci-memory-pvc
