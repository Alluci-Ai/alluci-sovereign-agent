name: production-readiness

on:
  pull_request:
  push:
    branches: [main]

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Run preflight
        run: bash scripts/production_readiness/preflight.sh

      - name: Run quality gate
        run: bash scripts/production_readiness/quality_gate.sh

      - name: Run security gate
        run: bash scripts/production_readiness/security_gate.sh

      - name: Run deploy gate
        run: bash scripts/production_readiness/deploy_gate.sh

      - name: Generate release report
        run: python3 scripts/production_readiness/generate_release_report.py

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness-report
          path: reports/release_readiness_*.md
