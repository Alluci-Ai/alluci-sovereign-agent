name: Windows MSIX Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pywin32 keyring

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Frontend dependencies
      run: npm install

    - name: Build Frontend
      run: npm run build

    - name: Bundle Backend with PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --console --name backend backend/app.py

    - name: Prepare MSIX Package Layout
      run: |
        mkdir app_layout
        cp dist/* app_layout/ -Recurse
        cp Package.appxmanifest app_layout/
        # Add assets and other required files to app_layout

    - name: Create MSIX Package
      shell: pwsh
      run: |
        # Note: This requires the Windows SDK (MakeAppx.exe) which is present on windows-latest
        & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.19041.0\x64\makeappx.exe" pack /d app_layout /p AlluciSovereignAgent.msix

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: alluci-windows-msix
        path: AlluciSovereignAgent.msix
