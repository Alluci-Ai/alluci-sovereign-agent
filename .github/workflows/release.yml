name: Release — SBOM, Signing, Staged Deploy

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v6.4.0)

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  quality-gate:
    name: Mandatory Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install Frontend Dependencies
        run: npm ci
      - name: Build DPK Kernel
        run: make -C backend/security linux verify
      - name: Bootstrap Backend
        run: |
          chmod +x scripts/bootstrap_backend.sh
          ./scripts/bootstrap_backend.sh
      - name: Make Quality
        run: make quality
        env:
          DPK_LIB_PATH: backend/security/build/libdpk.so
      - name: Build local image for scanning
        run: |
          docker build -t alluci-backend-scan:${{ github.sha }} -f Dockerfile.backend .
      - name: Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: alluci-backend-scan:${{ github.sha }}
          format: 'table'
          ignore-unfixed: true
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  build-and-sign:
    name: Build, SBOM, and Sign Images
    needs: quality-gate
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build-image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Lowercase Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/alluci-backend
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.4.0

      - name: Build and Push Backend Image
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-backend.json

      - name: Upload SBOM to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: sbom-backend.json
          asset_name: sbom-backend-${{ github.ref_name }}.json
          tag: ${{ github.ref_name }}

      - name: Sign the images
        run: |
          cosign sign --yes $(echo "${{ steps.meta.outputs.tags }}" | head -n 1)@${{ steps.build-image.outputs.digest }}
      - name: Verify Signature
        run: |
          cosign verify --yes $(echo "${{ steps.meta.outputs.tags }}" | head -n 1) \
            --certificate-identity-regexp "https://github.com/${{ github.repository_owner }}/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

  deploy-staging:
    name: Deploy to Staging
    needs: build-and-sign
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Deploy to Staging Cluster
        run: |
          echo "Deploying image with digest: ${{ needs.build-and-sign.outputs.digest }} to staging."
          # kubectl set image deployment/alluci-backend backend=ghcr.io/${{ github.repository }}/alluci-backend@${{ needs.build-and-sign.outputs.digest }}
      - name: Post-deploy Synthetic Check
        run: |
          # curl -f https://staging-alluci.example.com/api/v1/health
          echo "Staging checks PASSED."

  deploy-production:
    name: Deploy to Production
    needs: [deploy-staging, build-and-sign]
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Manual Approval Gate
        run: echo "Environment gate will handle approval."
      - name: Deploy to Production Cluster
        run: |
          echo "Deploying to production."
          # kubectl set image deployment/alluci-backend backend=ghcr.io/${{ github.repository }}/alluci-backend@${{ needs.build-and-sign.outputs.digest }}
      - name: Final Production Verification
        run: |
          # curl -f https://alluci.sovereign/api/v1/ready
          echo "[ VERIFIED ] Production deployment finalized."
      - name: Rollback Rehearsal/Info
        run: |
          echo "[ INFO ] In case of failure, run: ./scripts/rollback.sh"
          echo "[ INFO ] Rollback target: deployment/alluci-backend -n alluci"
