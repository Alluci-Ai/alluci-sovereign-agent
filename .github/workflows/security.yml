name: Security Pipeline (SBOM)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 2 * * *' # Run daily at 2AM UTC

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: alluci-agent-sbom.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SBOM
          path: alluci-agent-sbom.json

  license_audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Ruby for LicenseFinder
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install LicenseFinder
        run: gem install license_finder

      - name: Run License Audit
        run: |
          license_finder permitted_licenses add MIT
          license_finder permitted_licenses add Apache-2.0
          license_finder permitted_licenses add BSD
          license_finder permitted_licenses add ISC
          license_finder permitted_licenses add Python
          license_finder permitted_licenses add Zlib
          license_finder permitted_licenses add LGPL
          license_finder approvals add psycopg2-binary --why "Dynamically linked LGPL is permitted"
          license_finder approvals add python-telegram-bot --why "Dynamically linked LGPL is permitted"
          license_finder approvals add pylint --why "Dev dependency only"
          license_finder approvals add astroid --why "Dev dependency only"
          license_finder
