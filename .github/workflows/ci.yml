name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Install secret scanner
      run: pip install detect-secrets

    - name: Scan for new secrets
      run: |
        detect-secrets scan --baseline .detect-secrets-baseline.json || (echo "🔐 Secrets detected" && exit 1)

    - name: Run MyPy static type checking
      run: |
        mypy backend/

    - name: Run Pytest & Global Coverage (30% threshold)
      run: |
        pytest backend/ --cov=backend --cov-report=term-missing --cov-report=xml:backend/coverage.xml --cov-branch --cov-fail-under=30
    - name: Enforce Security-Critical Coverage (90% threshold)
      run: |
        pytest backend/security/ --cov=backend/security --cov-report=term-missing --cov-report=xml:backend/security/coverage.xml --cov-branch --cov-fail-under=90


  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/agent:${{ github.sha }} .
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.10.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/agent:${{ github.sha }}
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true
