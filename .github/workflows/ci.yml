name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Required for diff-cover to compare against the main branch

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install the main requirements
        pip install -r requirements.txt
        # Install dev requirements if available, plus diff-cover
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
        pip install diff-cover pytest-cov pytest-asyncio

    - name: Run Tier 1 Critical Path Tests (Strict 80%)
      run: |
        chmod +x scripts/test_critical_coverage.sh
        ./scripts/test_critical_coverage.sh

    - name: Run Full Test Suite (Generate Global Coverage)
      run: |
        # We run the full suite without the fail-under flag (handled in pytest.ini)
        # We use '|| true' so that if legacy tests have non-critical failures,
        # it still generates the coverage.xml needed for the diff-cover step below.
        pytest backend/tests/ --cov=backend --cov-report=xml:coverage.xml || true

    - name: Enforce Diff-Coverage (80% on New Code)
      if: github.event_name == 'pull_request'
      run: |
        # This will fail the PR if the lines ADDED in this PR have less than 80% coverage.
        diff-cover coverage.xml --compare-branch=origin/main --fail-under=80
