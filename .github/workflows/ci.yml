# .github/workflows/ci.yml — PRODUCTION QUALITY GATES (v6.4.0)

name: CI — Test, Lint, Security, Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  POLYTOPE_MASTER_KEY: ${{ secrets.TEST_POLYTOPE_MASTER_KEY }}
  JWT_SECRET_KEY:      ${{ secrets.TEST_JWT_SECRET_KEY }}
  CSRF_SECRET_KEY:     ${{ secrets.TEST_CSRF_SECRET_KEY }}
  GEMINI_API_KEY:      "test-key-for-ci"
  APP_ENV:             "testing"

jobs:
  build-dpk-kernel:
    name: Build DPK Native Kernel (C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build essentials
        run: sudo apt-get update && sudo apt-get install -y g++ make
      - name: Build and verify kernel
        run: |
          cd backend/security
          make linux
      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: dpk-kernel-linux
          path: backend/security/build/libdpk.so

  backend-tests:
    name: Backend (Tests, Coverage, Mypy, Alembic)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-dpk-kernel
    steps:
      - uses: actions/checkout@v4
      - name: Download kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: dpk-kernel-linux
          path: backend/security/build/
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run backend tests with coverage (70% threshold)
        run: |
          pytest
        env:
          PYTHONPATH: .
          DPK_LIB_PATH: backend/security/build/libdpk.so
      - name: Python lint check (ruff)
        run: ruff check backend/
      - name: Python format check (ruff)
        run: ruff format --check backend/
      - name: Python type check (mypy)
        run: mypy backend/
      - name: Check for unmigrated Alembic models
        run: |
          alembic check

  frontend-tests:
    name: Frontend (tsc, Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript type check
        run: npx tsc --noEmit
      - name: Frontend lint
        run: npx eslint . --max-warnings=0
      - name: Run vitest
        run: npm test

  security-scan:
    name: Security Scan (Gitleaks, Detect-Secrets, Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify no committed private keys
        run: |
          if git ls-files | xargs -I{} sh -c \
              'test -f "{}" && grep -l "BEGIN.*PRIVATE KEY\|BEGIN RSA PRIVATE" "{}"' 2>/dev/null | \
              grep -v ".gitignore\|MIGRATION_RUNBOOK\|.secrets.baseline"; then
            echo "FAIL: Private key file found in repository"
            exit 1
          fi
      - name: Build images for scanning
        run: |
          docker build -t alluci-backend:${{ github.sha }} -f Dockerfile.backend .
      - name: Scan backend image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: alluci-backend:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  readiness:
    name: Production Readiness Gate
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, security-scan]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Run preflight
        run: bash scripts/production_readiness/preflight.sh

      - name: Run quality gate
        run: bash scripts/production_readiness/quality_gate.sh

      - name: Run security gate
        run: bash scripts/production_readiness/security_gate.sh

      - name: Run deploy gate
        run: bash scripts/production_readiness/deploy_gate.sh

      - name: Generate release report
        run: python3 scripts/production_readiness/generate_release_report.py

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness-report
          path: reports/release_readiness_*.md
