# .github/workflows/ci.yml — RE-APPLIED SECURITY GATES

name: CI — Test, Lint, Security, Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  POLYTOPE_MASTER_KEY: ${{ secrets.TEST_POLYTOPE_MASTER_KEY }}
  JWT_SECRET_KEY:      ${{ secrets.TEST_JWT_SECRET_KEY }}
  CSRF_SECRET_KEY:     ${{ secrets.TEST_CSRF_SECRET_KEY }}
  GEMINI_API_KEY:      "test-key-for-ci"
  APP_ENV:             "testing"

jobs:
  build-dpk-kernel:
    name: Build DPK Native Kernel (C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build essentials
        run: sudo apt-get update && sudo apt-get install -y g++ make
      - name: Build and verify kernel
        run: |
          cd backend/security
          make all
          make verify
      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: dpk-kernel-linux
          path: backend/security/libdpk.so

  backend-tests:
    name: Backend Tests (Unit + Integration + Security)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-dpk-kernel
    steps:
      - uses: actions/checkout@v4
      - name: Download kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: dpk-kernel-linux
          path: backend/security/
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install all dependencies
        run: pip install -r requirements.txt
      - name: Verify manifest canonicalization matches TypeScript
        run: |
          python -c "
          from backend.routers.objectives import _canonicalize
          test_cases = [
              ({'z': 1, 'a': 2}, '{\"a\":2,\"z\":1}'),
              ({'b': {'y': 3, 'x': 4}, 'a': 1}, '{\"a\":1,\"b\":{\"x\":4,\"y\":3}}'),
              ([1, 'hello', None], '[1,\"hello\",null]'),
          ]
          for obj, expected in test_cases:
              result = _canonicalize(obj)
              assert result == expected, f'FAIL: {result} != {expected}'
          print('PASS: _canonicalize output matches TypeScript implementation')
          "

  frontend-tests:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify bridgeAuth.ts has CSRF headers
        run: |
          grep -c "X-CSRF-Token" lib/bridgeAuth.ts | xargs -I{} \
            sh -c 'test {} -ge 2 || (echo "FAIL: bridgeAuth.ts missing CSRF headers" && exit 1)'
          echo "PASS: bridgeAuth.ts has CSRF token headers"
      - name: Verify no hardcoded deprecated model IDs in kernel
        run: |
          grep -rn "gemini-pro-1\.5" kernel/ && \
            (echo "FAIL: Deprecated model ID in kernel/" && exit 1) || \
            echo "PASS: No deprecated model IDs in kernel/"

  security-scan:
    name: Security Scan (SAST + Dependency Audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify no TLS private keys committed
        run: |
          if git ls-files | xargs -I{} sh -c \
              'test -f "{}" && grep -l "BEGIN.*PRIVATE KEY\|BEGIN RSA PRIVATE" "{}"' 2>/dev/null | \
              grep -v ".gitignore\|MIGRATION_RUNBOOK"; then
            echo "FAIL: Private key file found in repository"
            exit 1
          fi
          echo "PASS: No committed private keys detected"
      - name: Verify .dockerignore exists and blocks certs/
        run: |
          test -f .dockerignore || (echo "FAIL: .dockerignore missing" && exit 1)
          grep -q "certs/" .dockerignore || (echo "FAIL: certs/ not in .dockerignore" && exit 1)
          echo "PASS: .dockerignore present and blocks certs/"
