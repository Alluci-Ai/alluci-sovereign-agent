[pytest]
testpaths = backend/tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
log_cli = true
log_cli_level = WARNING
markers =
   unit: Unit tests (no I/O)
   integration: Integration tests (DB, network)
   slow: Tests that take > 5 seconds
   security: Security-critical tests
   sanity: Smoke tests to ensure basic app health

env =
   APP_ENV=testing
   SOVEREIGN_MODE=True
   GEMINI_API_KEY=
   OPENAI_API_KEY=
   GROQ_API_KEY=
   ANTHROPIC_API_KEY=
   NVIDIA_NIM_API_KEY=
   ELEVENLABS_API_KEY=
   RUNWAY_API_KEY=
   MIDJOURNEY_API_KEY=

addopts =
   --cov=backend
   --cov-report=term-missing
   --cov-report=xml:backend/coverage.xml
   --cov-report=html:backend/coverage_html
   -x
   --tb=short
   -q
