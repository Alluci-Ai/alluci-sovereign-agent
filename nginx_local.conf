worker_processes 1;
daemon off;

events {
    worker_connections 1024;
}

http {
    include       /usr/local/etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Backend/Frontend Upstreams
    upstream backend {
        server 127.0.0.1:8000;
    }

    server {
        listen 8443 ssl;
        server_name 127.0.0.1;

        # TLS Certificates generated previously
        ssl_certificate      certs/fullchain.pem;
        ssl_certificate_key  certs/privkey.pem;

        # Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubdomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        # CSP is now primarily managed by the backend for API routes.
        # For the frontend, we use a strict policy that allows Google services.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.tailwindcss.com https://accounts.google.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' ws: wss: http: https:; frame-ancestors 'none';" always;
        
        # Proxy standard API Routes
        location /api/ {
            proxy_pass http://backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket Proxy connections
        location /ws/ {
            proxy_pass http://backend/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
        
        location /health {
            proxy_pass http://backend/health;
        }

        # Mock standard Frontend routing fallback
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
        }
    }
    
    server {
        listen 8080;
        server_name 127.0.0.1;
        return 301 https://$host:8443$request_uri;
    }
}
